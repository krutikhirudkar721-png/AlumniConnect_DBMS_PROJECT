{% extends 'base.html' %}{% block title %}Add Alumni | AlumniConnect{% endblock %}{% block content %}<h1>Add Alumni</h1><form class="form-grid" method="post"><label>First name *<input name="first_name" required></label><label>Last name *<input name="last_name" required></label><label>Email *<input name="email" type="email" required></label><label>Phone<input name="phone"></label><label>Location<input name="location"></label><label>Department *<select name="department_id" required><option value="">Select</option>{% for d in departments %}<option value="{{d.department_id}}">{{d.department_name}}</option>{% endfor %}</select></label><label>Graduation year *<input name="graduation_year" type="number" min="1950" max="2100" required></label><div class="form-section"><h2>Current Career (optional)</h2></div><label>Company<input name="career_company"></label><label>Industry<input name="career_industry"></label><label>Designation<input name="career_designation"></label><label>Job location<input name="career_location"></label><label>Joining date<input name="career_start" type="date"></label><div><button class="btn primary">Save Alumni</button></div></form>{% endblock %}
