{% extends 'base.html' %}{% block title %}Edit Profile | AlumniConnect{% endblock %}{% block content %}<h1>Edit Profile</h1><form class="form-grid" method="post"><label>First name<input name="first_name" value="{{person.first_name}}" required></label><label>Last name<input name="last_name" value="{{person.last_name}}" required></label><label>Email<input name="email" type="email" value="{{person.email}}" required></label><label>Phone<input name="phone" value="{{person.phone or ''}}"></label><label>Location<input name="location" value="{{person.location or ''}}"></label><label>Department<select name="department_id" required>{% for d in departments %}<option value="{{d.department_id}}" {% if d.department_id==person.department_id %}selected{% endif %}>{{d.department_name}}</option>{% endfor %}</select></label><label>Graduation year<input name="graduation_year" type="number" min="1950" max="2100" value="{{person.graduation_year}}" required></label><div><button class="btn primary">Update</button></div></form>{% endblock %}
