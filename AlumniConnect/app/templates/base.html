<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}AlumniConnect{% endblock %}</title><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"></head><body><nav class="nav"><a class="brand" href="{{url_for('alumni.dashboard') if session.get('user_id') else url_for('auth.login')}}">AlumniConnect</a>{% if session.get('user_id') %}<div class="navlinks"><a href="{{url_for('alumni.dashboard')}}">Dashboard</a><a href="{{url_for('alumni.directory')}}">Directory</a>{% if session.get('role')=='ADMIN' %}<a href="{{url_for('alumni.add')}}">Add Alumni</a><a href="{{url_for('reports.reports')}}">Reports</a>{% endif %}<a href="{{url_for('auth.logout')}}">Logout</a></div>{% endif %}</nav><main class="container">{% with ms=get_flashed_messages(with_categories=true) %}{% for c,m in ms %}<div class="alert {{c}}">{{m}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><script src="{{url_for('static',filename='js/script.js')}}"></script></body></html>
